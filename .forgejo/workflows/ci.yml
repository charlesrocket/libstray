---
name: CI
"on": [push, pull_request]

env:
  ZIG_VERSION: 0.16.0

jobs:
  test-linux:
    name: Test
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: sudo apt install -y libdbus-1-dev

      - name: Run tests
        run: |
          zig build test --verbose --summary all

  demo-linux:
    name: Demo
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        mode: ["fast", "safe", "small", "off"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: sudo apt install -y libdbus-1-dev

      - name: Build demo
        run: |
          zig build demo --release=${{ matrix.mode }} --verbose --summary all

  lint:
    name: Format
    runs-on: codeberg-medium
    if: "!startsWith(github.ref, 'refs/tags/')"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check .

  release:
    name: Release
    needs: ["test-linux", "demo-linux"]
    runs-on: codeberg-tiny
    if: ${{ forgejo.ref_type == 'tag' && forgejo.repository_owner == 'charlesrocket' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Extract changelog
        env:
          TAG: ${{ forgejo.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Publish
        uses: https://data.forgejo.org/actions/forgejo-release@v2.13.1
        with:
          direction: upload
          release-notes-file: release-notes.md
          skip-assets: true
